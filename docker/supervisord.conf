[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080 --no-interaction
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/reverb.log
stderr_logfile=/var/log/supervisor/reverb.err.log

[program:queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600 --no-interaction
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/queue.log
stderr_logfile=/var/log/supervisor/queue.err.log

[program:watch]
command=php artisan mikrotik:watch
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/watch.log
stderr_logfile=/var/log/supervisor/watch.err.log

[program:torch]
command=php artisan mikrotik:torch
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/torch.log
stderr_logfile=/var/log/supervisor/torch.err.log
